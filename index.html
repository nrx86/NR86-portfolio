<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Nikhil's Portfolio Landing Page">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikhil's Space</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('Image.png') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            padding: 1rem;
            z-index: 1000;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 0;
            padding: 0;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        nav a:hover {
            color: #00bfff;
            text-shadow: 0 0 10px #ff6ec7;
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero h1 {
  font-family: "Bookman Old Style", serif; /* Bold stylish font */
  font-size: 4rem;
  text-transform: uppercase;
  letter-spacing: 4px;
  color: #ffa500; /* Orange */
  text-shadow: 0 0 15px #ffa500, 0 0 30px #ff0000;
  animation: glow 2s ease-in-out infinite alternate;
}


@keyframes glow {
  from { text-shadow: 0 0 15px #ffa500, 0 0 30px #ffff00; }
  to { text-shadow: 0 0 20px #ffcc00, 0 0 40px #ff9900, 0 0 80px #ffff00; }
}

.hero a {
  margin-top: 2rem;
  padding: 1rem 2rem;
  background: linear-gradient(45deg, #ffa500, #ffff00); /* Orange + Yellow combo */
  color: black;
  text-decoration: none;
  border-radius: 30px;
  font-size: 1.2rem;
  font-weight: bold;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.hero a:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px #ffa500, 0 0 30px #ffff00;
}


        footer {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            text-align: center;
            padding: 1.5rem;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <ul>
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <div class="hero">
        <h1>Welcome🚀</h1>
        <p><b>Aspirant</b> | <b>Tech Enthusiast</b> | <b>Future Innovator</b></p>
        <a href="portfolio.html">View My Portfolio</a>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Nikhil | All Rights Reserved</p>
    </footer>

</body>

</html>
